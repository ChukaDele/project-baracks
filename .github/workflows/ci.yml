name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Major validation, format, lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Major doctrine / skill / legacy validation
        run: bash scripts/validate-major.sh

      - name: Major stability / learning validation
        run: bash scripts/validate-major-stability.sh

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Print exact Prettier output
        run: |
          for f in src/context/project-integrity.ts src/supervisor/human-blocker.ts src/web/remote-preview.ts tests/remote-preview.test.ts tests/supervisor-runtime.test.ts; do
            echo "--- FILE:$f START ---"
            pnpm exec prettier "$f"
            echo "--- FILE:$f END ---"
          done
          exit 1

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Strict type-check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build
