name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Major validation, format, lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Major doctrine / skill / legacy validation
        run: bash scripts/validate-major.sh

      - name: Major stability / learning validation
        run: bash scripts/validate-major-stability.sh

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Temporary v0.5.1 diagnostic gate: collect every deterministic failure in
      # one Actions run instead of stopping at the first formatter error. Restore
      # the normal strict step-by-step gate after applying the printed format diff.
      - name: Full hardening diagnostic
        run: |
          set +e

          pnpm exec prettier --write .
          FORMAT_FILES="$(git diff --name-only)"
          echo "=== PRETTIER DIFF ==="
          git diff -- .
          echo "=== END PRETTIER DIFF ==="

          pnpm lint
          LINT_STATUS=$?

          pnpm typecheck
          TYPECHECK_STATUS=$?

          pnpm test
          TEST_STATUS=$?

          pnpm build
          BUILD_STATUS=$?

          SNAPSHOT_STATUS=0
          if [ "$BUILD_STATUS" -eq 0 ]; then
            RUNTIME_TMP="$(mktemp -d)"
            bash scripts/build-major-runtime-snapshot.sh "$RUNTIME_TMP/runtime"
            SNAPSHOT_STATUS=$?
            rm -rf "$RUNTIME_TMP"
          else
            echo "Snapshot smoke skipped because production build failed."
            SNAPSHOT_STATUS=1
          fi

          echo "=== DIAGNOSTIC SUMMARY ==="
          if [ -n "$FORMAT_FILES" ]; then
            echo "format: FAIL ($FORMAT_FILES)"
            FORMAT_STATUS=1
          else
            echo "format: PASS"
            FORMAT_STATUS=0
          fi
          echo "lint: $LINT_STATUS"
          echo "typecheck: $TYPECHECK_STATUS"
          echo "tests: $TEST_STATUS"
          echo "build: $BUILD_STATUS"
          echo "snapshot: $SNAPSHOT_STATUS"

          if [ "$FORMAT_STATUS" -ne 0 ] || \
             [ "$LINT_STATUS" -ne 0 ] || \
             [ "$TYPECHECK_STATUS" -ne 0 ] || \
             [ "$TEST_STATUS" -ne 0 ] || \
             [ "$BUILD_STATUS" -ne 0 ] || \
             [ "$SNAPSHOT_STATUS" -ne 0 ]; then
            exit 1
          fi
