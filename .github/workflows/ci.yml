# Truthful CI for the disabled foundation: it runs exactly the canonical
# repository commands (format check, lint, strict type-check, full test
# suite, production build) and nothing more. The test suite itself covers
# fresh and upgrade migrations, the compiled CLI (built and exercised as
# dist/cli/index.js), the isolated hostile-environment regressions, the
# provider no-process guarantees, doctor human/JSON consistency, the
# single-read input-snapshot regressions, and every disabled-capability
# refusal. No production secrets are configured or required; no live
# provider executes; nothing paid runs; no external roadmap is written.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI verifies the tree; it never writes to the repository.
permissions:
  contents: read

# A newer run of the same ref supersedes an in-flight one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the repository pin ("packageManager" in
      # package.json); Node matches the pinned engines range ("node": ">=22").
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Strict type-check
        run: pnpm typecheck

      - name: Production build
        run: pnpm build

      # Complete suite: migrations (fresh + upgrade), compiled CLI, isolated
      # hostile environment, no-process discovery, doctor consistency,
      # input-snapshot and all disabled-capability regressions.
      - name: Tests
        run: pnpm test
