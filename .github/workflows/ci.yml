name: CI

on:
  pull_request:
  push:
    branches: [main, codex/major-v051-release-candidate]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Major validation, format, lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Canonical release validation
        run: pnpm validate:release

  attest-staged-validation-lease:
    name: Attest staged-validation lease
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/major-v051-release-candidate'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create canonical staged-validation lease
        env:
          EXACT_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/create-github-staged-validation-lease.mjs major-staged-validation-lease.json

      - name: Attest canonical lease
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: major-staged-validation-lease.json

      - name: Collect signed lease bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" major-staged-validation-attestation.json

      - name: Verify exact signed authority offline
        run: >-
          node scripts/verify-github-staged-validation-lease.mjs
          major-staged-validation-lease.json
          major-staged-validation-attestation.json
          "${{ github.sha }}"
          provider-field
          claude

      - name: Publish signed staged-validation authority
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: major-staged-validation-authority-${{ github.sha }}
          path: |
            major-staged-validation-lease.json
            major-staged-validation-attestation.json
          if-no-files-found: error
          retention-days: 7
