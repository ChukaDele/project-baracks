name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Major validation, format, lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Major doctrine / skill / legacy validation
        run: bash scripts/validate-major.sh

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Print exact runtime formatting patch
        run: |
          pnpm exec prettier --write \
            src/supervisor/cli.ts \
            src/supervisor/runtime.ts \
            src/supervisor/state.ts \
            src/supervisor/worker.ts \
            tests/router.test.ts \
            tests/supervisor-runtime.test.ts
          echo '--- PRETTIER PATCH START ---'
          git diff -- \
            src/supervisor/cli.ts \
            src/supervisor/runtime.ts \
            src/supervisor/state.ts \
            src/supervisor/worker.ts \
            tests/router.test.ts \
            tests/supervisor-runtime.test.ts
          echo '--- PRETTIER PATCH END ---'
          git diff --quiet -- \
            src/supervisor/cli.ts \
            src/supervisor/runtime.ts \
            src/supervisor/state.ts \
            src/supervisor/worker.ts \
            tests/router.test.ts \
            tests/supervisor-runtime.test.ts

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Strict type-check
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build
